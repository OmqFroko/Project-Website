<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account - Project Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Config/style.css" />
  <link rel="stylesheet" href="Config/account.css" />
</head>
<body class="auth-pending">
  <div class="shell">
    <header class="topbar">
      <div class="topbar__mark">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <div class="topbar__name">Project Workshop</div>
          <div class="topbar__sub">account</div>
        </div>
      </div>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </header>

    <p class="auth-loading">Checking your account…</p>

    <main class="authed-only">
      <p class="eyebrow">Account</p>
      <h1>Sign in to your<br /><span>workshop</span>.</h1>
      <p class="lede">Your timers are tied to your account, so sign in first to see them.</p>

      <section id="signed-out-panel" class="form-panel">
        <div class="auth-tabs">
          <button type="button" id="tab-signin" class="is-active">Sign in</button>
          <button type="button" id="tab-signup">Create account</button>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <div class="field">
            <label for="auth-email">Email</label>
            <input id="auth-email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="auth-password">Password</label>
            <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" />
          </div>
          <button id="auth-submit" type="submit" class="btn btn-primary btn-block">Sign in</button>
          <p id="auth-error" class="form-error"></p>
        </form>

        <div class="auth-divider">or</div>

        <button id="auth-google" type="button" class="btn btn-google btn-block">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2.1 1.5-4.8 2.5-7.7 2.5-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.6 5.6C41.9 36.1 44 30.5 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          Continue with Google
        </button>
      </section>

      <section id="signed-in-panel" class="form-panel is-hidden">
        <div class="signed-in-card">
          <div class="signed-in-card__who">
            <span id="signed-in-email"></span>
            <span id="signed-in-badge"></span>
          </div>
          <div class="signed-in-card__actions">
            <a href="index.html" class="btn btn-primary">Go to workshop</a>
            <button id="go-signout" class="btn btn-ghost">Sign out</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="Config/account.js"></script>
</body>
</html>
