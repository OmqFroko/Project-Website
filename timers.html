<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timers — Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Config/style.css" />
  <link rel="stylesheet" href="Config/timers.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar__mark">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <div class="topbar__name">Project Workshop</div>
          <div class="topbar__sub">is it really necessary?</div>
        </div>
      </div>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </header>

    <main>
      <p>Timers</p>
      <h1>Did I forget? I'll get <br /><span>notified</span>, anyways.</h1>
      <p class="lede">
        Just pick a time and set it and that's it.
      </p>

      <div id="permission-banner" class="banner">
        <p class="banner__text">
          <strong>Notifications are off.</strong> Turn them on so a timer can alert you when it finishes.
        </p>
        <button id="enable-notifications" class="btn btn-primary">Turn on notifications</button>
      </div>

      <section class="form-panel">
        <h2>New timer</h2>
        <form id="timer-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="timer-name">Name</label>
              <input id="timer-name" name="timer-name" type="text" placeholder="e.g. Stream starts" maxlength="80" required />
            </div>
            <div class="field">
              <label for="timer-date">Date</label>
              <input id="timer-date" name="timer-date" type="date" required />
            </div>
            <div class="field">
              <label for="timer-time">Time</label>
              <input id="timer-time" name="timer-time" type="time" step="1" required />
            </div>
            <button type="submit" class="btn btn-primary">Create timer</button>
          </div>
          <p id="form-error" class="form-error"></p>
        </form>
      </section>

      <div class="section-title">
        <h2>Your timers</h2>
      </div>
      <div id="timer-list" class="timer-list"></div>
      <div id="empty-state" class="empty-state">No timers yet. Create one above.</div>
    </main>
  </div>

  <script src="Config/timers.js"></script>
</body>
</html>
