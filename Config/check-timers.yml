name: Check timers

on:
  schedule:
    # Every 15 minutes — a good balance of promptness vs. GitHub Actions minutes.
    # Public repos get unlimited free Actions minutes, so if your repo is public
    # you can safely tighten this to "*/5 * * * *". See README for the trade-off.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  check-timers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Check for due timers and send push notifications
        working-directory: scripts
        run: node check-timers.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}