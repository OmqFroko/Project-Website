<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do — Workshop</title>
  <link rel="icon" href="Images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Config/style.css">
</head>
<body>

  <div id="wk-content">

    <a class="back-link page-shell" href="index.html">&larr; Workshop</a>

    <header class="todo-hero page-shell">
      <h1 class="todo-hero__title">To-Do</h1>
      <p class="todo-hero__subtitle">Saved automatically — closing the tab won't lose it.</p>
    </header>

    <main class="page-shell">
      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-form__input"
          placeholder="Add a task"
          autocomplete="off"
        >
        <button type="submit" class="todo-form__add">Add</button>
      </form>

      <div class="todo-filters" role="group" aria-label="Filter tasks">
        <button type="button" class="todo-filters__btn is-active" data-filter="all">All</button>
        <button type="button" class="todo-filters__btn" data-filter="active">Active</button>
        <button type="button" class="todo-filters__btn" data-filter="done">Done</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>
      <p id="todo-empty" class="todo-empty">Nothing here yet.</p>

      <div class="todo-footer">
        <span id="todo-count" class="todo-footer__count"></span>
        <button type="button" id="todo-clear-done" class="todo-footer__clear">Clear completed</button>
      </div>
    </main>

    <footer class="hub-footer">
      <p>Workshop &middot; updated as needed</p>
    </footer>

  </div>

  <script src="Config/gate.js"></script>
  <script src="Config/todo.js" defer></script>
</body>
</html>
