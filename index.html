<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Workshop</title>
  <link rel="icon" href="Images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Config/index.css">
</head>
<body>

  <header class="hub-hero">
    <div class="hub-hero__content">
      <p class="hub-hero__eyebrow">Personal tools</p>
      <h1 class="hub-hero__title">Workshop</h1>
      <p class="hub-hero__subtitle">
        Each these tools is used mainly by me so I can know my stuff daily.
      </p>
    </div>

    <div class="hero-blueprint" id="hero-blueprint" aria-hidden="true">
      <svg viewBox="0 0 360 320" fill="none">
        <!-- pegboard panel -->
        <rect x="20" y="16" width="320" height="288" rx="6" class="sketch-line sketch-line--panel" stroke="var(--wk-border)" stroke-width="2"/>

        <!-- hole grid, generated by Config/index.js -->
        <g id="pegboard-holes" stroke="var(--wk-steel)" stroke-width="1.4" fill="none"></g>

        <!-- hook 1 + wrench -->
        <line x1="120" y1="72" x2="120" y2="90" class="sketch-line sketch-line--hook" stroke="var(--wk-steel)" stroke-width="2"/>
        <g class="sketch-line sketch-line--tool" stroke="var(--wk-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M96 150c-10 0-18-8-18-18s8-18 18-18c4 0 8 1 11 4l-9 9 6 6 9-9c3 3 4 7 4 11 0 10-8 18-18 18-2 0-4 0-6-1l-40 40-9-9 40-40c-1-2-1-4-1-6z"/>
          <line x1="120" y1="90" x2="98" y2="112"/>
        </g>

        <!-- hook 2 + screwdriver -->
        <line x1="230" y1="96" x2="230" y2="114" class="sketch-line sketch-line--hook" stroke="var(--wk-steel)" stroke-width="2"/>
        <g class="sketch-line sketch-line--tool sketch-line--tool-2" stroke="var(--wk-steel)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="230" y1="114" x2="230" y2="150"/>
          <rect x="221" y="150" width="18" height="14" rx="2"/>
          <line x1="230" y1="164" x2="230" y2="228"/>
        </g>

        <!-- empty hook, waiting for the next tool -->
        <line x1="180" y1="200" x2="180" y2="218" class="sketch-line sketch-line--hook" stroke="var(--wk-border)" stroke-width="2"/>
      </svg>
    </div>
  </header>

  <main>
    <section class="pegboard" aria-label="Available tools">
      <div class="pegboard__grid" id="pegboard-grid">
        <!-- Cards are rendered by Config/index.js from TOOLS -->
      </div>
    </section>
  </main>

  <footer class="hub-footer">
    <p>Workshop &middot; updated as needed</p>
    <p class="hub-footer__notice">
      Built with AI assistance for personal use only. I'm not an experienced
      web developer or have much knowledge on this.
    </p>
  </footer>

  <script src="Config/index.js" defer></script>
</body>
</html>
